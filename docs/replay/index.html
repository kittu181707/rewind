<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="replay-data.js" defer></script>
  <script src="app.js" defer></script>
  <title>Rewind · Off is not undo</title>
</head>
<body data-mode="replay" data-case="a">
  <main>
    <header>
      <p class="brand">Rewind</p>
      <h1>Off is not undo.</h1>
      <p id="mode"></p>
    </header>
    <div class="layout">
      <section class="workspace" aria-label="Rewind conversation">
        <form id="request-form" class="card" hidden>
          <label for="request">What would you like to roll back?</label>
          <input id="request" required maxlength="2000" placeholder="Roll back the new feature">
          <button id="run" type="submit" disabled>Start rehearsal</button>
        </form>
        <form id="replay-form" class="card" hidden>
          <label for="case">Choose a captured run</label>
          <select id="case"><option value="a">Case A · Saved data breaks</option><option value="b">Case B · Targeting override</option><option value="refusal">Refusal · No verified fix</option></select>
          <button id="play" type="submit">Start replay</button>
        </form>
        <div id="controls" class="card controls" hidden><p id="progress" role="status"></p><button id="stop" type="button">Stop</button></div>
        <p id="notice" role="status"></p>
        <div id="chat" aria-label="Run events"></div>
        <noscript>JavaScript is required to display run events and record decisions.</noscript>
      </section>
      <aside id="inventory" class="card" aria-labelledby="inventory-title" hidden>
        <h2 id="inventory-title">Flagsmith flags</h2>
        <div id="flags" aria-live="polite">Reading the configured environments…</div>
      </aside>
    </div>
  </main>
</body>
</html>
